name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: Android projesini olustur
        run: npx cap add android

      - name: Uygulama ikonunu olustur
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#6a45f5'

      - name: Web dosyalarini Android'e aktar
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Olustur-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
